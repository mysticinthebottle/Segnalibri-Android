name: Build Android APK
'on':
workflow_dispatch:
push:
paths:
- "Segnalibri_sorgente.zip"
- ".github/workflows/android-build.yml"
permissions:
contents: read
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: "17"
- uses: gradle/actions/setup-gradle@v4
with:
gradle-version: "8.9"
- run: unzip -o Segnalibri_sorgente.zip
- run: gradle -p Segnalibri assembleDebug
- uses: actions/upload-artifact@v4
with:
name: Segnalibri-debug-apk
path: Segnalibri/app/build/outputs/apk/debug/*.apk
if-no-files-found: error
