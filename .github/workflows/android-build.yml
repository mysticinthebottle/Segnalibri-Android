
```yaml
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Segnalibri_sorgente.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o Segnalibri_sorgente.zip

      - name: Build debug APK
        run: gradle -p Segnalibri assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Segnalibri-debug-apk
          path: Segnalibri/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
```
